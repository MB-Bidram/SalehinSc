name: Publish encrypted portal request
run-name: 'Portal request #${{ inputs.issue }}'
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Encrypted request staging issue number
        required: true
        type: string
permissions: {}
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify role, signature, recipients, and encrypted attachments
        env:
          PORTAL_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-request.cjs
